name: Source Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tanyuan/requirements.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r tanyuan/requirements.txt
      - name: Validate QA classification
        run: python qa/policy_check.py
      - name: Run release gate
        run: python qa/run.py --gate release

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out Marketplace main as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Lanbasara/jianwei-marketplace
          ref: main
          path: .release-input/marketplace
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare ignored artifact parent
        run: mkdir dist
      - name: Build deterministic release artifacts
        run: python3 scripts/build_jianwei_release.py --github-context --required-ancestor origin/main --release-repo . --marketplace-repo .release-input/marketplace --out dist/release
      - name: Verify artifact checksums
        run: sha256sum -c SHA256SUMS
        working-directory: dist/release
      - name: Upload release and Marketplace candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jianwei-source-release-${{ github.sha }}
          path: dist/release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  publish:
    needs:
      - qa
      - build
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && vars.JIANWEI_RELEASE_TAG == github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: source-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jianwei-source-release-${{ github.sha }}
          path: dist/release
      - name: Verify downloaded checksums
        run: sha256sum -c SHA256SUMS
        working-directory: dist/release
      - name: Attest product and candidate provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release/jianwei-plugin.zip, dist/release/jianwei-marketplace-candidate.zip, dist/release/release.json
      - name: Publish GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/release/jianwei-plugin.zip dist/release/release.json dist/release/SHA256SUMS --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
